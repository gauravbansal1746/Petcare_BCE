<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caretakers Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/caretakers.css">
    <script src="js/caretakers.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="js/angular.min.js"></script>
    <script src="js/petcare-admin-http.js"></script>
    <script src="js/petcare-logout.js"></script>
    <script src="js/petcare-require-login.js"></script>
    <script>
        function apiFailMessage(resp) {
            var d = resp && resp.data;
            if (d && typeof d === "object" && d.message) return d.message;
            if (typeof d === "string") return d;
            return "Request failed.";
        }

        angular.module("myModule").controller("myController", function ($scope, $http) {
            var API_BASE = window.REACT_APP_API_URL || "https://petcarebce-production.up.railway.app";
            $scope.jsonUsersAry = [];
            $scope.getIdProofSrc = function (item) {
                var idProof = item && (item.idProof || item.idproofpic);
                console.log("ID Proof Path:", idProof);
                if (!idProof || !String(idProof).trim()) return "/pics/placeholder-pic.jpg";
                if (/^https?:\/\//i.test(idProof)) return idProof;
                return API_BASE + idProof;
            };

            $scope.fetchAndShowCaretakers = function () {
                $http.get(API_BASE + "/api/v1/admin/caretakers?page=1&limit=100").then(fxOk, fxNotOk);

                function fxOk(response) {
                    $scope.jsonUsersAry = (response.data && response.data.data) ? response.data.data : [];
                }
                function fxNotOk(response) {
                    alert(apiFailMessage(response));
                }
            };

            $scope.deleteCaretaker = function (emailid) {
                $http.get(API_BASE + "/api/v1/admin/caretakers/delete?xEmail=" + encodeURIComponent(emailid)).then(fxOk, fxNotOk);

                function fxOk(response) {
                    alert((response.data && response.data.message) ? response.data.message : "OK");
                    $scope.fetchAndShowCaretakers();
                }

                function fxNotOk(response) {
                    alert(apiFailMessage(response));
                }
            };
        });
    </script>
</head>

<body ng-app="myModule" ng-controller="myController">
    <nav class="navbar ">
        <div class="container-fluid container justify-content-between align-items-center">
            <a class="navbar-brand" href="/dash-admin">
                <span id="title-text">Caretakers Manager</span>
            </a>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="petcareLogout();">Log out</button>
        </div>
    </nav>

    <div class="container container-fluid">
        <div class="row">
            <div class="col-md-12 mt-4">
                <center>
                    <a href="#" class="btn btn-outline-success" ng-click="fetchAndShowCaretakers();">Load All Caretakers</a>
                </center>
            </div>
            <div class="col-md-12 mt-4">
                <table class="table table-hover">
                    <thead>
                        <tr>
                          <th scope="col">#</th>
                          <th scope="col">Email Id</th>
                          <th scope="col">Name</th>
                          <th scope="col">Mobile</th>
                          <th scope="col">Address</th>
                          <th scope="col">Website</th>
                          <th scope="col">State</th>
                          <th scope="col">City</th>
                          <th scope="col">Pin</th>
                          <th scope="col">Selected Pets</th>
                          <th scope="col">Id Pic</th>
                          <th scope="col">Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr ng-repeat="obj in jsonUsersAry">
                          <th scope="row">{{$index}}</th>
                          <td>{{obj.email}}</td>
                          <td>{{obj.name}}</td>
                          <td>{{obj.mobile}}</td>
                          <td>{{obj.address}}</td>
                          <td>{{obj.website}}</td>
                          <td>{{obj.state}}</td>
                          <td>{{obj.city}}</td>
                          <td>{{obj.pin}}</td>
                          <td>{{obj.selpets}}</td>
                          <td>
                            <img
                              ng-src="{{getIdProofSrc(obj)}}"
                              alt="ID Proof"
                              width="150"
                              height="100"
                              style="border-radius:8px;border:1px solid #ccc;object-fit:cover;"
                              onerror="this.src='/pics/placeholder-pic.jpg';"
                            >
                          </td>
                          <td> <button type="button"  class="btn btn-outline-danger" id="block-btn" ng-click="deleteCaretaker(obj.email);">Delete</button></td>
                        </tr>
                      </tbody>
                </table>
            </div>
        </div>

    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
            crossorigin="anonymous"></script>
</body>

</html>
