<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/dash-admin.css">
    <script src="js/dash-admin.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="js/angular.min.js"></script>
    <script src="js/petcare-admin-http.js"></script>
    <script src="js/petcare-logout.js"></script>
    <script src="js/petcare-require-login.js"></script>
    <script>
        function apiFailMessage(resp) {
            var d = resp && resp.data;
            if (d && typeof d === "object" && d.message) return d.message;
            if (typeof d === "string") return d;
            return "Request failed.";
        }

        angular.module("myModule").controller("myController", function ($scope, $http) {
            var API_BASE = window.REACT_APP_API_URL || "https://petcarebce-production.up.railway.app";
            $scope.jsonUsersAry = [];

            $scope.fetchAndShow = function () {
                $http.get(API_BASE + "/api/v1/admin/users?page=1&limit=100").then(fxOk, fxNotOk);

                function fxOk(response) {
                    $scope.jsonUsersAry = (response.data && response.data.data) ? response.data.data : [];
                }
                function fxNotOk(response) {
                    alert(apiFailMessage(response));
                }
            };

            $scope.blockUser = function (emailid) {
                $http.get(API_BASE + "/api/v1/admin/users/block?xEmail=" + encodeURIComponent(emailid)).then(fxOk, fxNotOk);

                function fxOk(response) {
                    alert((response.data && response.data.message) ? response.data.message : "OK");
                }

                function fxNotOk(response) {
                    alert(apiFailMessage(response));
                }
            };

            $scope.resumeUser = function (emailid) {
                $http.get(API_BASE + "/api/v1/admin/users/resume?xEmail=" + encodeURIComponent(emailid)).then(fxOk, fxNotOk);

                function fxOk(response) {
                    alert((response.data && response.data.message) ? response.data.message : "OK");
                }

                function fxNotOk(response) {
                    alert(apiFailMessage(response));
                }
            };
        });
    </script>
</head>

<body ng-app="myModule" ng-controller="myController">
    <nav class="navbar ">
        <div class="container-fluid container justify-content-between align-items-center">
            <a class="navbar-brand" href="/dash-admin">
                <span id="title-text">User Manager</span>
            </a>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="petcareLogout();">Log out</button>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-12 mt-4">
                <center>
                    <a href="#" class="btn btn-outline-success" ng-click="fetchAndShow();">Load All Users</a>
                </center>
            </div>
            <div class="col-md-12 mt-4">
                <table class="table table-hover">
                    <thead>
                        <tr>
                          <th scope="col">#</th>
                          <th scope="col">Email Id</th>
                          <th scope="col">User Type</th>
                          <th scope="col">Status</th>
                          <th scope="col">Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr ng-repeat="obj in jsonUsersAry">
                          <th scope="row">{{$index}}</th>
                          <td>{{obj.emailid}}</td>
                          <td>{{obj.utype}}</td>
                          <td>{{obj.status === 1 ? 'Active' : 'Blocked'}}</td>
                          <td> <button type="button"  class="btn btn-outline-danger" id="block-btn" ng-click="blockUser(obj.emailid);">Block</button></td>
                          <td> <button type="button" class="btn btn-outline-success" id="resume-btn" ng-click="resumeUser(obj.emailid);">Resume</button></td>
                        </tr>
                      </tbody>
                </table>
            </div>
        </div>

    </div>

    

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
            crossorigin="anonymous"></script>
</body>

</html>
