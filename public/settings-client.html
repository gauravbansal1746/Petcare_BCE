<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings — Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script src="js/petcare-logout.js"></script>
    <script src="js/petcare-require-login.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <span class="navbar-brand">Settings</span>
            <div class="ms-auto">
                <a href="/dclient" class="btn btn-outline-secondary btn-sm me-2">Dashboard</a>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="petcareLogout();">Log out</button>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <h1 class="h4">Account</h1>
        <p class="text-muted mb-1">Signed in as:</p>
        <p id="acct-email" class="fw-semibold">—</p>
        <p class="text-muted small mb-4">Password changes are not available in this demo UI. Contact support or update the user in the database if needed.</p>
        <p><a href="/caretkr-finder">Find a caretaker</a> · <a href="profile-client.html">Edit profile</a></p>
    </div>
    <script>
        document.getElementById("acct-email").textContent = localStorage.getItem("email") || "(unknown)";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
</body>
</html>
